<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body{
    background: #f6f6f6;
}

.navbar{
    width: 100%;
    padding: 18px 50px;
    background: #0c1c2c;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo{
    font-size: 26px;
    font-weight: bold;
    color: white;
    letter-spacing: 1px;
   font-family: sans-serif
}

.nav-links{
    list-style: none;
    display: flex;
    gap: 35px;
}

.nav-links li a{
    text-decoration: none;
    color: white;
    font-size: 16px;
    transition: 0.3s;
}

.nav-links li a:hover{

    color: #ffb100;
    border-bottom: 2px solid #ffb100;
    padding-bottom: 4px;
}

.btn-signin{
    background: #ffb100;
    color: #000;
    padding: 10px 22px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.btn-signin:hover{
    background: #e19a00;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    background: #ffffff;
}

.hero{
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 70px 80px;
    align-items: center;
}

.hero-left h1{
    font-size: 60px;
    font-weight: 800;
    line-height: 1.1;
    color: #111;
}

.cta-btn{
    margin-top: 30px;
    display: inline-block;
    background: #ffb100;
    padding: 14px 28px;
    text-decoration: none;
    font-size: 18px;
    color: #000;
    font-weight: bold;
    border-radius: 6px;
    transition: 0.3s;
}

.cta-btn:hover{
    background: #e19a00;
}

</head>
<body>
   <header class="navbar">
        <div class="logo">Finzo..</div>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>

            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
